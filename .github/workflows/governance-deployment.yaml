name: '[prod] Deploy governance portal'

on: 
  push:
    branches: 
      - prod

jobs:
  deploy_testnet_validator:
    uses: ./.github/workflows/governance-service.yaml
    with:
      SWR_ORGANIZATION: prod-qubetics
      ARGOCD_BRANCH: prod
      HUAWEI_REGION: 'ap-southeast-1'
      ARGOCD_REPOSITORY: Qubetics/argocd-qubetics
      DEPLOYMENT_PATH: Governance-portal/governance-deployment.yaml
      HUAWEI_IMAGE: governance-portal
      DOCKER_USERNAME: ap-southeast-1@BQG9INQF0BKVHSNQOLJG
      ENV: ${{ vars.PROD_GOVERNANCE_PORTAL_ENV }}
    secrets:
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      GIT_SSH_KEY: ${{ secrets.ARGOCD_SSH_KEY }}
