name: '[testnet] Deploy governance portal'

on: 
  push:
    branches: 
      - testnet

jobs:
  deploy_governance_portal:
    uses: ./.github/workflows/testnet-governance-service.yaml
    with:
      SWR_ORGANIZATION: testnet-qubetics
      ARGOCD_BRANCH: testnet_v2
      HUAWEI_REGION: 'ap-southeast-3'
      ARGOCD_REPOSITORY: Qubetics/argocd-qubetics
      DEPLOYMENT_PATH: Governance-portal/governance-deployment.yaml
      HUAWEI_IMAGE: governance-portal
      DOCKER_USERNAME: ap-southeast-3@HPUAJWWFSLCMD312AZSR
      ENV: ${{ vars.TESTNET_GOVERNANCE_PORTAL_ENV }}
    secrets:
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD_NEW }}
      GIT_SSH_KEY: ${{ secrets.ARGOCD_SSH_KEY_NEW }}
